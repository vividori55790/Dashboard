<!--
    Telemetry console — the general one, for whatever the hub happens to be reading.

    Every channel on this page was discovered from the stream. Nothing is declared here, because
    the console cannot know what a given installation measures and guessing is how the page it
    replaces went wrong.

    What it replaces read data.temp, data.vin, data.vout, data.iin, data.iout, data.pin, data.pout,
    data.efficiency, data.phase and data.status_flags. The hub sends none of those: its frame
    carries nodeId, variable, value, unit and a verdict. So the primary console could not display
    the product's own telemetry at all.

    It had a general mechanism for this -- fetch('/api/config') and build the panels from the
    answer -- and no server ever implemented /api/config, so the fetch failed on every load and the
    page fell into a legacy path that fabricated:

        latestPSFB.vout = 48.0;    // a device that had reported nothing
        latestDAB.vout  = 96.0;
        latestPSFB.vin  = data.vin // one converter's reading shown under the other's name

    Numbers nobody measured, displayed as readings. Discovery from the stream removes the need for
    the config endpoint entirely: the console shows what actually arrives, which is the only list
    that is true by construction.
-->
<meta charset="utf-8">
<title>Telemetry Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg:#0B0F17; --panel:#131A26; --panel-2:#1A2331; --line:#26324A;
        --text:#E8EDF7; --text-2:#97A3BA; --text-3:#5F6D87;
        --accent:#3D8BFF; --ok:#2ED47A; --warn:#FFB020; --alarm:#FF4D5E; --sim:#C77DFF;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font-family:Inter,"Segoe UI","Malgun Gothic",sans-serif; font-size:14px; line-height:1.5; }
    .mono { font-family:"JetBrains Mono",ui-monospace,Consolas,monospace; }

    header { display:flex; align-items:center; gap:14px; padding:16px 22px;
             border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
    h1 { font-size:16px; font-weight:600; margin:0; }
    .sub { color:var(--text-3); font-size:12.5px; }
    .chip { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--line);
            border-radius:999px; font-size:12.5px; color:var(--text-2); background:var(--panel-2); }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--text-3); flex:none; }

    #sim-banner { display:none; padding:9px 22px; background:rgba(199,125,255,.12);
                  border-bottom:1px solid rgba(199,125,255,.35); color:var(--sim); font-size:13px; font-weight:500; }

    main { padding:22px; max-width:1500px; margin:0 auto; }
    h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3);
         margin:0 0 12px; font-weight:600; }

    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:15px;
            display:flex; flex-direction:column; gap:9px; transition:border-color .2s,opacity .3s; }
    .card.alarm { border-color:var(--alarm); }
    .card.stale { opacity:.5; }
    .card .name { font-size:12px; font-weight:600; color:var(--text-2); word-break:break-all; }
    .card .node { font-size:10.5px; color:var(--text-3); }
    .card .val { font-size:28px; font-weight:600; letter-spacing:-.02em; line-height:1.1; }
    .card .val .u { font-size:13px; font-weight:500; color:var(--text-3); margin-left:5px; }
    .card canvas { width:100%; height:44px; display:block; }
    .card .foot { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-3); gap:8px; }
    .card .foot .v.ok { color:var(--ok); font-weight:600; }
    .card .foot .v.alarm { color:var(--alarm); font-weight:600; }

    .panels { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:22px; }
    @media (max-width:1000px){ .panels{grid-template-columns:1fr;} }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:16px 18px; }

    select, button, input[type=range] { font-family:inherit; font-size:12.5px; }
    select, button { background:var(--panel-2); color:var(--text); border:1px solid var(--line);
                     border-radius:7px; padding:6px 10px; }
    button { cursor:pointer; }
    button:hover { border-color:var(--accent); }
    input[type=range] { width:100%; }

    .row { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .note { color:var(--text-3); font-size:12px; }
    .stat { font-size:12.5px; color:var(--text-2); }
    #empty { color:var(--text-3); padding:36px 0; text-align:center; }
</style>

<header>
    <div>
        <h1>Telemetry Console</h1>
        <div class="sub">채널은 수신되는 스트림에서 발견됩니다 — 선언된 목록이 아닙니다</div>
    </div>
    <div style="flex:1"></div>
    <span class="chip"><span class="dot" id="conn-dot"></span><span id="conn-text">연결 중…</span></span>
    <span class="chip mono" id="stat-chip">0 채널 · 0 패킷</span>
</header>

<div id="sim-banner">합성 데이터입니다. 이 화면의 값은 시뮬레이터가 생성한 것이며 측정값이 아닙니다.</div>

<main>
    <h2>수신 중인 채널</h2>
    <section class="grid" id="grid"></section>
    <div id="empty">아직 도착한 채널이 없습니다.</div>

    <div class="panels">
        <div class="panel">
            <h2>주파수 스펙트럼 · /api/spectrum</h2>
            <div class="row">
                <select id="spec-ch"><option value="">채널 선택</option></select>
                <select id="spec-win">
                    <option value="30">최근 30초</option>
                    <option value="60" selected>최근 60초</option>
                    <option value="180">최근 180초</option>
                </select>
                <button id="spec-go">계산</button>
            </div>
            <canvas id="spec-canvas" style="width:100%;height:170px;display:block"></canvas>
            <div class="stat mono" id="spec-stat" style="margin-top:8px">아직 계산하지 않았습니다.</div>
        </div>

        <div class="panel">
            <h2>되감기 · /api/dvr/replay</h2>
            <div class="row">
                <button id="dvr-load">타임라인 불러오기</button>
                <span class="note" id="dvr-range">—</span>
            </div>
            <input type="range" id="dvr-scrub" min="0" max="100" value="100" disabled>
            <div class="stat mono" id="dvr-stat" style="margin-top:10px">되감기는 호스트가 보관 중인 프레임을 읽습니다.</div>
            <div class="stat mono" id="dvr-frames" style="margin-top:8px"></div>
        </div>
    </div>
</main>

<script src="telemetry-client.js"></script>
<script>
(function () {
    'use strict';

    var HISTORY = 80;
    var STALE_MS = 10000;

    var channels = {};   // key -> {node, variable, unit, value, z, isAnomaly, at, series[]}
    var order = [];      // discovery order, so cards do not reshuffle as data arrives
    var packets = 0;

    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');

    function key(node, variable) { return node + '␟' + variable; }
    function domId(k) { return 'c' + k.replace(/[^a-zA-Z0-9]/g, '-'); }

    // ---- connection ------------------------------------------------------
    var CONN = {
        CONNECTED:['WS 연결됨','var(--ok)'],
        CONNECTED_SSE:['SSE 연결됨 (WebSocket 불가)','var(--warn)'],
        DISCONNECTED:['연결 끊김 — 재시도 중','var(--alarm)'],
        RETRYING_SLOWLY:['연결 끊김 — 재시도 간격 확대','var(--alarm)'],
        ERROR:['연결 오류 — 재시도 중','var(--alarm)']
    };
    function setConnection(s) {
        var c = CONN[s] || [s, 'var(--text-3)'];
        document.getElementById('conn-text').textContent = c[0];
        document.getElementById('conn-dot').style.background = c[1];
    }

    // ---- channel discovery ----------------------------------------------
    function discover(k, ch) {
        order.push(k);
        empty.style.display = 'none';

        var el = document.createElement('div');
        el.className = 'card';
        el.id = domId(k);
        el.innerHTML =
            '<div><div class="name">' + esc(ch.variable) + '</div>' +
            '<div class="node mono">' + esc(ch.node) + '</div></div>' +
            '<div class="val" id="v-' + domId(k) + '">—</div>' +
            '<canvas id="s-' + domId(k) + '"></canvas>' +
            '<div class="foot"><span id="z-' + domId(k) + '">수신 대기</span>' +
            '<span id="a-' + domId(k) + '"></span></div>';
        grid.appendChild(el);

        var opt = document.createElement('option');
        opt.value = ch.node + '.' + ch.variable;   // the key the series store uses
        opt.textContent = ch.node + '.' + ch.variable;
        document.getElementById('spec-ch').appendChild(opt);
    }

    function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
            return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
        });
    }

    function onPacket(p) {
        if (!p || typeof p.variable !== 'string' || typeof p.value !== 'number') return;

        packets++;
        if (p.simulated === true) document.getElementById('sim-banner').style.display = 'block';

        var node = p.nodeId || '(node 없음)';
        var k = key(node, p.variable);
        var ch = channels[k];

        if (!ch) {
            ch = channels[k] = { node: node, variable: p.variable, series: [] };
            discover(k, ch);
        }

        ch.unit = p.unit || '';
        ch.value = p.value;
        // A frame with no score was not judged. Substituting zero here would state a verdict the
        // engine deliberately withheld during warm-up.
        ch.z = (typeof p.anomalyScore === 'number') ? p.anomalyScore : null;
        ch.isAnomaly = p.isAnomaly === true;
        ch.at = Date.now();

        ch.series.push(p.value);
        if (ch.series.length > HISTORY) ch.series.shift();

        render(k, ch);
        document.getElementById('stat-chip').textContent =
            order.length + ' 채널 · ' + packets.toLocaleString() + ' 패킷';
    }

    function render(k, ch) {
        var id = domId(k);
        var card = document.getElementById(id);
        card.classList.remove('stale');
        card.classList.toggle('alarm', ch.isAnomaly);

        var v = document.getElementById('v-' + id);
        v.innerHTML = fmt(ch.value) + '<span class="u">' + esc(ch.unit) + '</span>';
        v.style.color = ch.isAnomaly ? 'var(--alarm)' : 'var(--text)';

        document.getElementById('z-' + id).textContent =
            ch.z === null ? '기준선 학습 중' : ('z = ' + ch.z.toFixed(2) + 'σ');

        var a = document.getElementById('a-' + id);
        a.className = 'v ' + (ch.z === null ? '' : (ch.isAnomaly ? 'alarm' : 'ok'));
        a.textContent = ch.z === null ? '' : (ch.isAnomaly ? '이상' : '정상');

        spark('s-' + id, ch.series, ch.isAnomaly);
    }

    // Significant figures rather than a fixed width: this console does not know whether a channel
    // is a 1200 rpm or a 0.02 g, and a fixed 2 decimals makes one of them unreadable.
    function fmt(x) {
        var a = Math.abs(x);
        if (a >= 1000) return x.toFixed(0);
        if (a >= 10) return x.toFixed(1);
        if (a >= 1) return x.toFixed(2);
        return x.toFixed(4);
    }

    function spark(id, data, alarm) {
        var c = document.getElementById(id);
        if (!c || data.length < 2) return;
        var w = c.width = c.clientWidth, h = c.height = 44;
        var ctx = c.getContext('2d');
        ctx.clearRect(0, 0, w, h);
        var lo = Math.min.apply(null, data), hi = Math.max.apply(null, data);
        if (lo === hi) { lo -= 1; hi += 1; }
        ctx.strokeStyle = alarm ? '#FF4D5E' : '#3D8BFF';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (var i = 0; i < data.length; i++) {
            var x = (i / (data.length - 1)) * w;
            var y = h - 3 - ((data[i] - lo) / (hi - lo)) * (h - 6);
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // A channel that has gone quiet keeps its last value but says how old it is. A frozen reading
    // and a live one must not look the same.
    setInterval(function () {
        var now = Date.now();
        order.forEach(function (k) {
            var ch = channels[k];
            var card = document.getElementById(domId(k));
            if (!card || !ch.at) return;
            var stale = now - ch.at > STALE_MS;
            card.classList.toggle('stale', stale);
            if (stale) {
                document.getElementById('z-' + domId(k)).textContent =
                    Math.round((now - ch.at) / 1000) + '초간 수신 없음';
            }
        });
    }, 1000);

    // ---- spectrum --------------------------------------------------------
    document.getElementById('spec-go').addEventListener('click', function () {
        var ch = document.getElementById('spec-ch').value;
        var win = document.getElementById('spec-win').value;
        var stat = document.getElementById('spec-stat');

        if (!ch) { stat.textContent = '채널을 먼저 선택하세요.'; return; }
        stat.textContent = '계산 중…';

        fetch('/api/spectrum?channel=' + encodeURIComponent(ch) + '&windowSec=' + win)
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (d.Status !== 'Success') {
                    stat.textContent = '스펙트럼 없음: ' + (d.Reason || '알 수 없는 이유');
                    clearCanvas('spec-canvas');
                    return;
                }
                drawSpectrum(d);
                stat.textContent =
                    d.Samples + ' 샘플 · 측정 샘플레이트 ' + d.SampleRateHz.toFixed(2) + ' Hz · ' +
                    'bin ' + d.BinHz.toFixed(4) + ' Hz · ' +
                    (d.PeakHz ? ('최대 ' + d.PeakHz.toFixed(4) + ' Hz (주기 ' + (1 / d.PeakHz).toFixed(2) + ' s)')
                              : 'DC 외 피크 없음');
            })
            .catch(function (e) { stat.textContent = '요청 실패: ' + e.message; });
    });

    function clearCanvas(id) {
        var c = document.getElementById(id);
        c.getContext('2d').clearRect(0, 0, c.width, c.height);
    }

    function drawSpectrum(d) {
        var c = document.getElementById('spec-canvas');
        var w = c.width = c.clientWidth, h = c.height = 170;
        var ctx = c.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        // Bin 0 is the mean and is not plotted: it dwarfs every other bin and is not a frequency
        // the signal contains.
        var mags = d.Magnitudes.slice(1);
        if (!mags.length) return;
        var max = Math.max.apply(null, mags);
        if (max <= 0) return;

        ctx.fillStyle = '#3D8BFF';
        for (var i = 0; i < mags.length; i++) {
            var x = (i / mags.length) * w;
            var bh = (mags[i] / max) * (h - 22);
            ctx.fillRect(x, h - 16 - bh, Math.max(1, w / mags.length - 0.5), bh);
        }

        ctx.fillStyle = '#5F6D87';
        ctx.font = '10px JetBrains Mono, monospace';
        ctx.fillText('0 Hz', 2, h - 4);
        ctx.textAlign = 'right';
        ctx.fillText(d.NyquistHz.toFixed(2) + ' Hz', w - 2, h - 4);
        ctx.textAlign = 'left';
    }

    // ---- DVR -------------------------------------------------------------
    var dvr = { start: 0, duration: 0 };

    document.getElementById('dvr-load').addEventListener('click', function () {
        var stat = document.getElementById('dvr-stat');
        stat.textContent = '불러오는 중…';

        fetch('/api/dvr/replay?window=10')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                dvr.start = d.timelineStartSec;
                dvr.duration = d.maxDurationSec;
                document.getElementById('dvr-range').textContent =
                    dvr.duration.toFixed(1) + '초 분량 보관 중';
                var slider = document.getElementById('dvr-scrub');
                slider.disabled = dvr.duration <= 0;
                slider.value = 100;
                stat.textContent = dvr.duration > 0
                    ? '슬라이더를 움직여 그 시점의 프레임을 읽습니다.'
                    : '보관된 프레임이 없습니다.';
                if (dvr.duration > 0) scrub();
            })
            .catch(function (e) { stat.textContent = '요청 실패: ' + e.message; });
    });

    document.getElementById('dvr-scrub').addEventListener('input', scrub);

    function scrub() {
        if (dvr.duration <= 0) return;
        var pct = Number(document.getElementById('dvr-scrub').value) / 100;
        var t = dvr.duration * pct;

        fetch('/api/dvr/replay?t=' + t.toFixed(2) + '&window=4')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                document.getElementById('dvr-stat').textContent =
                    't = ' + t.toFixed(1) + 's · 프레임 ' + d.totalFrames + '개 (창 ' + d.windowSec + 's)';

                // Latest value per channel inside the window, so the panel reads like a snapshot of
                // that moment rather than a list of every frame in it.
                var latest = {};
                (d.frames || []).forEach(function (f) {
                    var prev = latest[f.ChannelName];
                    if (!prev || f.TimestampSec >= prev.TimestampSec) latest[f.ChannelName] = f;
                });

                var names = Object.keys(latest).sort();
                document.getElementById('dvr-frames').innerHTML = names.length
                    ? names.map(function (n) {
                        var f = latest[n];
                        // HasVerdict distinguishes "scored 0.0" from "never examined". A frame the
                        // recorder stored without a verdict must not be shown as a calm 0.00 sigma.
                        var verdict = f.HasVerdict
                            ? (f.ZScore.toFixed(2) + 'σ' + (f.IsAnomaly ? ' 이상' : ''))
                            : '판정 없음';
                        return esc(n) + ' = ' + fmt(f.Value) + '  <span style="color:var(--text-3)">'
                            + verdict + '</span>';
                    }).join('<br>')
                    : '<span style="color:var(--text-3)">이 창에는 프레임이 없습니다.</span>';
            })
            .catch(function (e) { document.getElementById('dvr-stat').textContent = '요청 실패: ' + e.message; });
    }

    // ---- start -----------------------------------------------------------
    if (typeof TelemetryClient !== 'undefined') {
        TelemetryClient.onStatusChange(setConnection);
        TelemetryClient.onData(onPacket);
        TelemetryClient.connect('ws://' + location.hostname + ':' + (location.port || '8080') + '/ws');
    } else {
        setConnection('ERROR');
        document.getElementById('conn-text').textContent =
            'telemetry-client.js 를 불러오지 못했습니다 — 호스트를 통해 열어주세요';
    }
})();
</script>
