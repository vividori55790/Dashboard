<!--
    Starter: one channel, drawn as a gauge and a rolling chart.

        starter_chart_gauge.html?channel=dab.bus_voltage&min=350&max=450

    The gauge needs a range. Give it one with ?min= and ?max=; without them the page tracks the
    range it has actually seen and says so, because a bar drawn against invented bounds tells the
    reader a fraction that means nothing.

    It used to read data.temp, data.rpm and data.vibration, which no hub sends.
-->
<meta charset="utf-8">
<title>Telemetry starter — gauge and chart</title>
<style>
    body { background:#0B0F17; color:#E8EDF7; font-family:"Segoe UI","Malgun Gothic",sans-serif;
           margin:0; padding:28px; }
    h1 { font-size:16px; margin:0 0 4px; font-weight:600; }
    .sub { color:#5F6D87; font-size:13px; margin-bottom:22px; }
    .panel { background:#131A26; border:1px solid #26324A; border-radius:12px; padding:20px;
             max-width:640px; }
    .name { font-size:12px; color:#97A3BA; font-weight:600; word-break:break-all; }
    .val { font-size:40px; font-weight:600; margin:10px 0; letter-spacing:-.02em; }
    .val.absent { color:#5F6D87; font-weight:400; }
    .val .u { font-size:16px; color:#5F6D87; margin-left:6px; }
    .bar { height:8px; background:#1A2331; border-radius:99px; overflow:hidden; }
    .bar > i { display:block; height:100%; width:0; background:#3D8BFF; transition:width .2s; }
    .range { display:flex; justify-content:space-between; font-size:11px; color:#5F6D87;
             margin-top:5px; font-family:"JetBrains Mono",Consolas,monospace; }
    canvas { width:100%; height:150px; display:block; margin-top:18px; }
    .foot { font-size:12px; color:#5F6D87; margin-top:12px; }
    .alarm { color:#FF4D5E; }
</style>

<h1>Telemetry starter — gauge and chart</h1>
<div class="sub" id="sub">?channel= 로 채널을 지정하세요. 없으면 처음 도착한 채널을 사용합니다.</div>

<div class="panel">
    <div class="name" id="name">채널 대기 중</div>
    <div class="val absent" id="val">—</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="range"><span id="lo">—</span><span id="hi">—</span></div>
    <canvas id="chart"></canvas>
    <div class="foot" id="foot">연결 중…</div>
</div>

<script src="telemetry-client.js"></script>
<script>
    var q = new URLSearchParams(location.search);
    var wanted = q.get('channel');
    var declaredMin = q.has('min') ? Number(q.get('min')) : null;
    var declaredMax = q.has('max') ? Number(q.get('max')) : null;

    var adopted = null, history = [], seenMin = null, seenMax = null;

    TelemetryClient.onStatusChange(function (s) {
        if (!adopted) document.getElementById('foot').textContent = '연결 상태: ' + s;
    });

    TelemetryClient.onData(function (p) {
        if (!p || typeof p.variable !== 'string' || typeof p.value !== 'number') return;

        if (wanted) { if (p.variable !== wanted) return; }
        else if (!adopted) { adopted = p.variable; }
        else if (p.variable !== adopted) { return; }

        document.getElementById('name').textContent = p.variable + '  ·  ' + (p.nodeId || '');

        var val = document.getElementById('val');
        val.className = 'val' + (p.isAnomaly ? ' alarm' : '');
        val.innerHTML = p.value.toFixed(3) + '<span class="u">' + (p.unit || '') + '</span>';

        seenMin = seenMin === null ? p.value : Math.min(seenMin, p.value);
        seenMax = seenMax === null ? p.value : Math.max(seenMax, p.value);

        // Declared bounds if given, observed ones otherwise -- and the labels say which, so nobody
        // reads a bar filled against a range the page invented.
        var lo = declaredMin !== null ? declaredMin : seenMin;
        var hi = declaredMax !== null ? declaredMax : seenMax;
        var declared = declaredMin !== null && declaredMax !== null;

        document.getElementById('lo').textContent = lo.toFixed(2);
        document.getElementById('hi').textContent =
            hi.toFixed(2) + (declared ? ' (지정 범위)' : ' (관측 범위)');

        document.getElementById('fill').style.width =
            (hi > lo ? Math.max(0, Math.min(100, ((p.value - lo) / (hi - lo)) * 100)) : 0) + '%';
        document.getElementById('fill').style.background = p.isAnomaly ? '#FF4D5E' : '#3D8BFF';

        history.push(p.value);
        if (history.length > 120) history.shift();
        draw(p.isAnomaly);

        document.getElementById('foot').textContent = (typeof p.anomalyScore === 'number')
            ? ('z = ' + p.anomalyScore.toFixed(2) + 'σ')
            : '기준선 학습 중';
    });

    function draw(alarm) {
        var c = document.getElementById('chart');
        if (history.length < 2) return;
        var w = c.width = c.clientWidth, h = c.height = 150;
        var ctx = c.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        var lo = Math.min.apply(null, history), hi = Math.max.apply(null, history);
        if (lo === hi) { lo -= 1; hi += 1; }

        ctx.strokeStyle = alarm ? '#FF4D5E' : '#3D8BFF';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var i = 0; i < history.length; i++) {
            var x = (i / (history.length - 1)) * w;
            var y = h - 8 - ((history[i] - lo) / (hi - lo)) * (h - 16);
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    TelemetryClient.connect('ws://' + location.hostname + ':' + (location.port || '8080') + '/ws');
</script>
