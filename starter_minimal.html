<!--
    The smallest page that shows live telemetry. Copy it and build on it.

    One idea to take away: a frame describes ONE channel. It arrives as

        { nodeId, variable, value, unit, anomalyScore?, isAnomaly?, simulated? }

    so you match on `variable` exactly and you put the reading where that channel belongs.

    What this file used to do, and what to avoid:

        const v = (data.variable || '').toLowerCase();
        if (v.includes('temp'))      ...temperature box...
        else if (v.includes('vib'))  ...vibration box...
        else                         ...temperature box...   // <- anything unmatched

    Substring matching puts `psfb.output_voltage` and `grid.voltage` in the same box, and that
    final `else` writes every unrecognised channel into the temperature reading. It also read
    `data.temp`, which no hub sends.

    `anomalyScore` may be absent: the engine reports no score until it has a baseline. Absent is
    not zero, and showing 0.00σ during warm-up states a verdict nobody reached.
-->
<meta charset="utf-8">
<title>Telemetry starter — minimal</title>
<style>
    body { background:#0B0F17; color:#E8EDF7; font-family:"Segoe UI","Malgun Gothic",sans-serif;
           margin:0; padding:28px; }
    h1 { font-size:16px; font-weight:600; margin:0 0 4px; }
    .sub { color:#5F6D87; font-size:13px; margin-bottom:22px; }
    #status { color:#5F6D87; font-size:13px; margin-bottom:18px; }
    table { border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px 18px 8px 0; border-bottom:1px solid #26324A; }
    th { color:#5F6D87; font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
    .val { font-family:"JetBrains Mono",Consolas,monospace; font-size:16px; }
    .alarm { color:#FF4D5E; }
    .quiet { color:#5F6D87; }
</style>

<h1>Telemetry starter — minimal</h1>
<div class="sub">도착한 채널만 표시합니다. 목록은 미리 정해두지 않습니다.</div>
<div id="status">연결 중…</div>

<table>
    <thead><tr><th>노드</th><th>채널</th><th>값</th><th>판정</th></tr></thead>
    <tbody id="rows"></tbody>
</table>

<script src="telemetry-client.js"></script>
<script>
    var rows = {};   // "node|variable" -> <tr>

    TelemetryClient.onStatusChange(function (state) {
        document.getElementById('status').textContent = '연결 상태: ' + state;
    });

    TelemetryClient.onData(function (p) {
        if (!p || typeof p.variable !== 'string' || typeof p.value !== 'number') return;

        var key = (p.nodeId || '?') + '|' + p.variable;
        var row = rows[key];

        // A channel appears the first time it reports, and never before.
        if (!row) {
            row = rows[key] = document.createElement('tr');
            row.innerHTML = '<td>' + (p.nodeId || '?') + '</td><td>' + p.variable +
                            '</td><td class="val"></td><td></td>';
            document.getElementById('rows').appendChild(row);
        }

        row.cells[2].textContent = p.value.toFixed(3) + ' ' + (p.unit || '');
        row.cells[2].className = 'val' + (p.isAnomaly ? ' alarm' : '');

        // Absent score means the engine has no baseline yet. Do not print 0.00.
        row.cells[3].textContent = (typeof p.anomalyScore === 'number')
            ? (p.anomalyScore.toFixed(2) + 'σ' + (p.isAnomaly ? ' 이상' : ''))
            : '기준선 학습 중';
        row.cells[3].className = (typeof p.anomalyScore === 'number') ? '' : 'quiet';
    });

    TelemetryClient.connect('ws://' + location.hostname + ':' + (location.port || '8080') + '/ws');
</script>
