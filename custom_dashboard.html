<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일반 장비 (기본)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0C10;
            --surface: #1F2833;
            --card: #141A22;
            --accent: #66FCF1;
            --accent-glow: 0 0 15px rgba(102, 252, 241, 0.4);
            --danger: #FF2E63;
            --text: #C5C6C7;
            --text-bright: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding: 24px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #2C3540;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span { color: var(--accent); }

        .chip {
            background: #141A22;
            border: 1px solid #2C3540;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); box-shadow: var(--accent-glow);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .widget-card {
            background: var(--card);
            border: 1px solid #2C3540;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .widget-card:hover { border-color: var(--accent); }

        .widget-title {
            font-size: 12px;
            font-weight: 700;
            color: #8892B0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .widget-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-bright);
        }

        .widget-unit {
            font-size: 14px;
            color: var(--accent);
            margin-left: 4px;
        }

        .widget-footer {
            margin-top: 12px;
            font-size: 11px;
            color: #8892B0;
            display: flex;
            justify-content: space-between;
        }

        .z-score-tag {
            background: rgba(102, 252, 241, 0.1);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .z-score-tag.anomaly {
            background: rgba(255, 46, 99, 0.2);
            color: var(--danger);
            box-shadow: 0 0 10px rgba(255, 46, 99, 0.5);
        }

        .gauge-bar-bg {
            background: #1B2430;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .gauge-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        canvas.widget-chart {
            width: 100%;
            height: 120px;
            background: #0B0C10;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚀 <span>일반 장비 (기본)</span></h1>
        <div class="chip">
            <div class="dot"></div>
            <span id="conn-status">연결 중...</span>
        </div>
    </header>

    <main class="dashboard-grid" id="dashboard-container">
        <!-- Rendered dynamically from widgets schema -->
    </main>

    <script src="http://localhost:8099/telemetry-client.js"></script>
    <script>
        const widgetConfigs = [
  {
    "Id": "w-ambient-temperature",
    "WidgetType": "gauge_meter",
    "Title": "\uC628\uB3C4",
    "Field": "ambient.temperature",
    "Unit": "\u00B0C",
    "MinLimit": 0,
    "MaxLimit": 80,
    "ColorTheme": "#3D8BFF",
    "ColumnSpan": 1,
    "RowSpan": 1
  },
  {
    "Id": "w-ambient-temperature-trend",
    "WidgetType": "line_chart",
    "Title": "\uC628\uB3C4 \u00B7 \uCD94\uC774",
    "Field": "ambient.temperature",
    "Unit": "\u00B0C",
    "MinLimit": 0,
    "MaxLimit": 80,
    "ColorTheme": "#3D8BFF",
    "ColumnSpan": 1,
    "RowSpan": 1
  },
  {
    "Id": "w-ambient-humidity",
    "WidgetType": "gauge_meter",
    "Title": "\uC2B5\uB3C4",
    "Field": "ambient.humidity",
    "Unit": "%",
    "MinLimit": 0,
    "MaxLimit": 100,
    "ColorTheme": "#8B7CFF",
    "ColumnSpan": 1,
    "RowSpan": 1
  },
  {
    "Id": "w-ambient-humidity-trend",
    "WidgetType": "line_chart",
    "Title": "\uC2B5\uB3C4 \u00B7 \uCD94\uC774",
    "Field": "ambient.humidity",
    "Unit": "%",
    "MinLimit": 0,
    "MaxLimit": 100,
    "ColorTheme": "#8B7CFF",
    "ColumnSpan": 1,
    "RowSpan": 1
  },
  {
    "Id": "w-machine-vibration",
    "WidgetType": "gauge_meter",
    "Title": "\uC9C4\uB3D9",
    "Field": "machine.vibration",
    "Unit": "g",
    "MinLimit": 0,
    "MaxLimit": 2,
    "ColorTheme": "#00B8A9",
    "ColumnSpan": 1,
    "RowSpan": 1
  },
  {
    "Id": "w-machine-vibration-trend",
    "WidgetType": "line_chart",
    "Title": "\uC9C4\uB3D9 \u00B7 \uCD94\uC774",
    "Field": "machine.vibration",
    "Unit": "g",
    "MinLimit": 0,
    "MaxLimit": 2,
    "ColorTheme": "#00B8A9",
    "ColumnSpan": 1,
    "RowSpan": 1
  },
  {
    "Id": "w-machine-speed",
    "WidgetType": "gauge_meter",
    "Title": "\uD68C\uC804\uC218",
    "Field": "machine.speed",
    "Unit": "rpm",
    "MinLimit": 0,
    "MaxLimit": 3000,
    "ColorTheme": "#C77DFF",
    "ColumnSpan": 1,
    "RowSpan": 1
  },
  {
    "Id": "w-machine-speed-trend",
    "WidgetType": "line_chart",
    "Title": "\uD68C\uC804\uC218 \u00B7 \uCD94\uC774",
    "Field": "machine.speed",
    "Unit": "rpm",
    "MinLimit": 0,
    "MaxLimit": 3000,
    "ColorTheme": "#C77DFF",
    "ColumnSpan": 1,
    "RowSpan": 1
  }
];
        const chartBuffers = {};

        function buildDashboard() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = '';

            widgetConfigs.forEach(w => {
                const card = document.createElement('div');
                card.className = 'widget-card';
                card.id = `card-${w.Id}`;

                let innerHtml = `<div class="widget-title">${w.Title}</div>`;

                if (w.WidgetType === 'digital_card') {
                    innerHtml += `
                        <div class="widget-value" id="val-${w.Id}" style="color: ${w.ColorTheme}">--<span class="widget-unit">${w.Unit}</span></div>
                        <div class="widget-footer">
                            <span>${w.Field}</span>
                            <span id="z-${w.Id}">수신 대기</span>
                        </div>`;
                } else if (w.WidgetType === 'gauge_meter') {
                    innerHtml += `
                        <div class="widget-value" id="val-${w.Id}" style="color: ${w.ColorTheme}">--<span class="widget-unit">${w.Unit}</span></div>
                        <div class="gauge-bar-bg">
                            <div class="gauge-bar-fill" id="gauge-${w.Id}" style="background-color: ${w.ColorTheme}"></div>
                        </div>
                        <div class="widget-footer">
                            <span>${w.MinLimit} ~ ${w.MaxLimit} ${w.Unit}</span>
                            <span id="z-${w.Id}">수신 대기</span>
                        </div>`;
                } else if (w.WidgetType === 'line_chart') {
                    chartBuffers[w.Id] = [];
                    innerHtml += `
                        <div class="widget-value" id="val-${w.Id}" style="font-size: 20px; color: ${w.ColorTheme}">-- ${w.Unit}</div>
                        <canvas class="widget-chart" id="chart-${w.Id}"></canvas>
                        <div class="widget-footer">
                            <span>${w.Field}</span>
                            <span>최근 30 샘플</span>
                        </div>`;
                }

                card.innerHTML = innerHtml;
                container.appendChild(card);
            });
        }

        function drawSparkline(canvasId, data, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.parentElement.clientWidth;
            const h = canvas.height = 120;

            ctx.clearRect(0, 0, w, h);
            if (data.length < 2) return;

            let min = Math.min(...data);
            let max = Math.max(...data);
            if (min === max) { min -= 1; max += 1; }

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();

            const step = w / (data.length - 1);
            data.forEach((val, i) => {
                const x = i * step;
                const y = h - ((val - min) / (max - min)) * (h - 20) - 10;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        // Every widget starts unknown. A channel that has not reported is not a channel reading
        // zero, and the two must not look the same -- that distinction is the whole reason this
        // page exists rather than a screenshot.
        const latest = {};

        function setConnection(status) {
            const el = document.getElementById('conn-status');
            const dot = document.querySelector('.chip .dot');
            if (!el) return;

            const text = {
                CONNECTED: 'WS 연결됨 (:8099)',
                CONNECTED_SSE: 'SSE 연결됨 (WebSocket 사용 불가)',
                DISCONNECTED: '연결 끊김 - 재시도 중',
                RETRYING_SLOWLY: '연결 끊김 - 재시도 간격을 늘리는 중',
                ERROR: '연결 오류 - 재시도 중'
            }[status] || status;

            el.innerText = text;
            const live = status === 'CONNECTED' || status === 'CONNECTED_SSE';
            if (dot) dot.style.backgroundColor = live ? '#00FF66' : '#FF2E63';
        }

        function render(w) {
            const state = latest[w.Field];
            const valEl = document.getElementById(`val-${w.Id}`);

            if (!state) {
                if (valEl) valEl.innerHTML = `--<span class="widget-unit">${w.Unit}</span>`;
                return;
            }

            const unit = state.unit || w.Unit;

            if (valEl) {
                valEl.innerHTML = state.value.toFixed(2) + `<span class="widget-unit">${unit}</span>`;
                // Colour follows the detector's verdict rather than a threshold re-derived here,
                // which could disagree with the engine that decided.
                valEl.style.color = state.isAnomaly ? '#FF2E63' : w.ColorTheme;
            }

            const zEl = document.getElementById(`z-${w.Id}`);
            if (zEl) {
                // Absent rather than zero during warm-up: the engine reports no score until it has
                // a baseline, and printing 0.0σ would state a verdict nobody reached.
                zEl.innerText = (typeof state.anomalyScore === 'number')
                    ? `z = ${state.anomalyScore.toFixed(2)}σ`
                    : '기준선 학습 중';
            }

            if (w.WidgetType === 'gauge_meter') {
                const gauge = document.getElementById(`gauge-${w.Id}`);
                if (gauge && w.MaxLimit > w.MinLimit) {
                    const pct = Math.min(100, Math.max(0,
                        ((state.value - w.MinLimit) / (w.MaxLimit - w.MinLimit)) * 100));
                    gauge.style.width = pct + '%';
                    gauge.style.backgroundColor = state.isAnomaly ? '#FF2E63' : w.ColorTheme;
                }
            } else if (w.WidgetType === 'line_chart') {
                const buf = chartBuffers[w.Id];
                if (buf) {
                    buf.push(state.value);
                    if (buf.length > 30) buf.shift();
                    drawSparkline(`chart-${w.Id}`, buf, state.isAnomaly ? '#FF2E63' : w.ColorTheme);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            buildDashboard();

            if (typeof TelemetryClient === 'undefined') {
                setConnection('ERROR');
                const el = document.getElementById('conn-status');
                if (el) el.innerText = 'telemetry-client.js 를 불러오지 못했습니다 (호스트가 실행 중인지 확인하세요)';
                return;
            }

            TelemetryClient.onStatusChange(status => setConnection(status));
            TelemetryClient.connect('ws://localhost:8099/ws');

            TelemetryClient.onData(packet => {
                // One packet, one channel. Widgets are matched on the variable that arrived,
                // and a widget whose channel is not in this packet is left alone -- never filled
                // in from a different quantity.
                if (!packet || typeof packet.variable !== 'string') return;
                if (typeof packet.value !== 'number') return;

                latest[packet.variable] = {
                    value: packet.value,
                    unit: packet.unit,
                    isAnomaly: packet.isAnomaly === true,
                    anomalyScore: typeof packet.anomalyScore === 'number' ? packet.anomalyScore : undefined
                };

                widgetConfigs.filter(w => w.Field === packet.variable).forEach(render);
            });
        });
    </script>
</body>
</html>
