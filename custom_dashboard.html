<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelemetryDashboard - Interactive No-Code Web Console Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0C10;
            --surface: #1F2833;
            --card: #141A22;
            --accent: #66FCF1;
            --accent-glow: 0 0 15px rgba(102, 252, 241, 0.4);
            --danger: #FF2E63;
            --text: #C5C6C7;
            --text-bright: #FFFFFF;
            --border: #2C3540;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding: 24px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span { color: var(--accent); }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--surface);
            color: var(--text-bright);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: var(--accent-glow);
        }

        .btn-primary {
            background: var(--accent);
            color: #0B0C10;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: #45E6DB;
            color: #0B0C10;
        }

        .btn-danger {
            background: rgba(255, 46, 99, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #FFF;
        }

        .chip {
            background: #141A22;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); box-shadow: var(--accent-glow);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            min-height: 400px;
            padding: 10px;
            border: 2px dashed rgba(102, 252, 241, 0.15);
            border-radius: 14px;
        }

        .widget-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: grab;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .widget-card:active { cursor: grabbing; }
        .widget-card.dragging { opacity: 0.4; transform: scale(0.98); }
        .widget-card:hover { border-color: var(--accent); }

        .widget-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .widget-title {
            font-size: 12px;
            font-weight: 700;
            color: #8892B0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .widget-actions {
            display: flex;
            gap: 6px;
        }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: #8892B0;
            cursor: pointer;
            font-size: 14px;
            padding: 2px;
        }

        .action-icon-btn:hover { color: var(--accent); }

        .widget-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-bright);
        }

        .widget-unit {
            font-size: 14px;
            color: var(--accent);
            margin-left: 4px;
        }

        .widget-footer {
            margin-top: 12px;
            font-size: 11px;
            color: #8892B0;
            display: flex;
            justify-content: space-between;
        }

        .z-score-tag {
            background: rgba(102, 252, 241, 0.1);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .z-score-tag.anomaly {
            background: rgba(255, 46, 99, 0.2);
            color: var(--danger);
            box-shadow: 0 0 10px rgba(255, 46, 99, 0.5);
        }

        .gauge-bar-bg {
            background: #1B2430;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .gauge-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        canvas.widget-chart {
            width: 100%;
            height: 120px;
            background: #0B0C10;
            border-radius: 6px;
            margin-top: 10px;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 480px;
            max-width: 90vw;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #8892B0;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: #141A22;
            border: 1px solid var(--border);
            color: var(--text-bright);
            padding: 10px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚀 <span>TelemetryDashboard</span> No-Code Builder Console</h1>
        <div class="toolbar">
            <button class="btn btn-primary" onclick="openWidgetModal()">+ Add Widget</button>
            <button class="btn" onclick="saveLayout()">💾 Save Layout</button>
            <button class="btn" onclick="exportStandaloneHtml()">⚡ Export Standalone HTML</button>
            <button class="btn btn-danger" onclick="resetLayout()">🔄 Reset</button>
            <div class="chip">
                <div class="dot"></div>
                <span id="conn-status">WS CONNECTED (:8080)</span>
            </div>
        </div>
    </header>

    <main class="dashboard-grid" id="dashboard-container">
        <!-- Widget cards rendered here -->
    </main>

    <!-- Widget Palette & Config Modal -->
    <div class="modal-overlay" id="widget-modal">
        <div class="modal-box">
            <div class="modal-title" id="modal-title-text">➕ Add New Dynamic Widget</div>
            
            <div class="form-group">
                <label>Widget Type</label>
                <select class="form-control" id="cfg-type">
                    <option value="digital_card">Digital Value Card</option>
                    <option value="line_chart">Real-Time Waveform Chart</option>
                    <option value="gauge_meter">Gauge Meter</option>
                    <option value="zscore_card">ML Anomaly Z-Score Card</option>
                </select>
            </div>

            <div class="form-group">
                <label>Widget Display Title</label>
                <input type="text" class="form-control" id="cfg-title" placeholder="e.g. Edge Temp Sensor (CH-1)">
            </div>

            <div class="form-group">
                <label>Telemetry Field Key</label>
                <select class="form-control" id="cfg-field">
                    <option value="temp">temp (Temperature °C)</option>
                    <option value="vibration">vibration (Vibration g)</option>
                    <option value="vin">vin (Input Voltage V)</option>
                    <option value="vout">vout (Output Voltage V)</option>
                    <option value="iin">iin (Input Current A)</option>
                    <option value="iout">iout (Output Current A)</option>
                    <option value="anomalyScore">anomalyScore (Z-Score σ)</option>
                    <option value="rate">rate (Sampling Rate Hz)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Unit Label</label>
                <input type="text" class="form-control" id="cfg-unit" value="°C">
            </div>

            <div class="form-group">
                <label>Color Theme</label>
                <select class="form-control" id="cfg-color">
                    <option value="#66FCF1">Cyan Teal (#66FCF1)</option>
                    <option value="#BA68C8">Purple (#BA68C8)</option>
                    <option value="#00FF66">Neon Green (#00FF66)</option>
                    <option value="#FF2E63">Neon Danger Red (#FF2E63)</option>
                    <option value="#FFEA00">Yellow (#FFEA00)</option>
                </select>
            </div>

            <div class="form-group" id="group-limits">
                <label>Min / Max Gauge Range</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" class="form-control" id="cfg-min" value="0">
                    <input type="number" class="form-control" id="cfg-max" value="100">
                </div>
            </div>

            <div class="modal-buttons">
                <button class="btn" onclick="closeWidgetModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveWidgetConfig()">Confirm & Apply</button>
            </div>
        </div>
    </div>

    <script src="http://localhost:8080/telemetry-client.js"></script>
    <script>
        let widgets = [
            { Id: "w-temp", WidgetType: "digital_card", Title: "Edge Temp Sensor (CH-1)", Field: "temp", Unit: "°C", ColorTheme: "#66FCF1" },
            { Id: "w-vib", WidgetType: "digital_card", Title: "Vibration Accelerometer (CH-2)", Field: "vibration", Unit: "g", ColorTheme: "#BA68C8" },
            { Id: "w-vin", WidgetType: "gauge_meter", Title: "Primary Bus Voltage (CH-3)", Field: "vin", Unit: "V", MinLimit: 0, MaxLimit: 500, ColorTheme: "#00FF66" },
            { Id: "w-zscore", WidgetType: "zscore_card", Title: "System ML Z-Score Engine", Field: "anomalyScore", Unit: "σ", ColorTheme: "#FF2E63" },
            { Id: "w-chart", WidgetType: "line_chart", Title: "Real-Time Telemetry Waveform", Field: "temp", Unit: "°C", ColorTheme: "#66FCF1" }
        ];

        let editingWidgetId = null;
        let chartBuffers = {};
        let dragSrcEl = null;

        function initLayout() {
            const saved = localStorage.getItem('telemetry_custom_dashboard_layout');
            if (saved) {
                try { widgets = JSON.parse(saved); } catch (e) {}
            }
            renderDashboard();
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = '';

            widgets.forEach(w => {
                const card = document.createElement('div');
                card.className = 'widget-card';
                card.id = `card-${w.Id}`;
                card.setAttribute('draggable', 'true');
                setupDragEvents(card, w.Id);

                let innerHtml = `
                    <div class="widget-header-row">
                        <div class="widget-title">${w.Title}</div>
                        <div class="widget-actions">
                            <button class="action-icon-btn" onclick="openWidgetModal('${w.Id}')">⚙️</button>
                            <button class="action-icon-btn" onclick="deleteWidget('${w.Id}')">❌</button>
                        </div>
                    </div>`;

                if (w.WidgetType === 'digital_card') {
                    innerHtml += `
                        <div class="widget-value" id="val-${w.Id}" style="color: ${w.ColorTheme}">--<span class="widget-unit">${w.Unit}</span></div>
                        <div class="widget-footer">
                            <span>Field: ${w.Field}</span>
                            <span>Live Telemetry</span>
                        </div>`;
                } else if (w.WidgetType === 'gauge_meter') {
                    innerHtml += `
                        <div class="widget-value" id="val-${w.Id}" style="color: ${w.ColorTheme}">--<span class="widget-unit">${w.Unit}</span></div>
                        <div class="gauge-bar-bg">
                            <div class="gauge-bar-fill" id="gauge-${w.Id}" style="background-color: ${w.ColorTheme}"></div>
                        </div>
                        <div class="widget-footer">
                            <span>Min: ${w.MinLimit || 0} ${w.Unit}</span>
                            <span>Max: ${w.MaxLimit || 100} ${w.Unit}</span>
                        </div>`;
                } else if (w.WidgetType === 'zscore_card') {
                    innerHtml += `
                        <div class="widget-value" id="val-${w.Id}" style="color: ${w.ColorTheme}">0.0<span class="widget-unit">${w.Unit}</span></div>
                        <div class="widget-footer">
                            <span>Status: <strong id="zs-status-${w.Id}" class="z-score-tag">NORMAL</strong></span>
                            <span>ML Z-Score Engine</span>
                        </div>`;
                } else if (w.WidgetType === 'line_chart') {
                    chartBuffers[w.Id] = chartBuffers[w.Id] || [];
                    innerHtml += `
                        <div class="widget-value" id="val-${w.Id}" style="font-size: 20px; color: ${w.ColorTheme}">-- ${w.Unit}</div>
                        <canvas class="widget-chart" id="chart-${w.Id}"></canvas>
                        <div class="widget-footer">
                            <span>Real-time Trend (${w.Field})</span>
                            <span>30 Samples</span>
                        </div>`;
                }

                card.innerHTML = innerHtml;
                container.appendChild(card);
            });
        }

        // HTML5 Drag and Drop Handlers
        function setupDragEvents(card, id) {
            card.addEventListener('dragstart', (e) => {
                dragSrcEl = card;
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', id);
            });

            card.addEventListener('dragover', (e) => {
                if (e.preventDefault) e.preventDefault();
                return false;
            });

            card.addEventListener('drop', (e) => {
                if (e.stopPropagation) e.stopPropagation();
                const srcId = e.dataTransfer.getData('text/plain');
                if (srcId !== id) {
                    const srcIdx = widgets.findIndex(w => w.Id === srcId);
                    const targetIdx = widgets.findIndex(w => w.Id === id);
                    if (srcIdx >= 0 && targetIdx >= 0) {
                        const [moved] = widgets.splice(srcIdx, 1);
                        widgets.splice(targetIdx, 0, moved);
                        saveLayout();
                        renderDashboard();
                    }
                }
                return false;
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
            });
        }

        // Modal Logic
        function openWidgetModal(id = null) {
            editingWidgetId = id;
            const modal = document.getElementById('widget-modal');
            const titleText = document.getElementById('modal-title-text');

            if (id) {
                titleText.innerText = '⚙️ Configure Widget Settings';
                const w = widgets.find(x => x.Id === id);
                if (w) {
                    document.getElementById('cfg-type').value = w.WidgetType;
                    document.getElementById('cfg-title').value = w.Title;
                    document.getElementById('cfg-field').value = w.Field;
                    document.getElementById('cfg-unit').value = w.Unit;
                    document.getElementById('cfg-color').value = w.ColorTheme;
                    document.getElementById('cfg-min').value = w.MinLimit || 0;
                    document.getElementById('cfg-max').value = w.MaxLimit || 100;
                }
            } else {
                titleText.innerText = '➕ Add New Dynamic Widget';
                document.getElementById('cfg-title').value = '';
            }

            modal.classList.add('active');
        }

        function closeWidgetModal() {
            document.getElementById('widget-modal').classList.remove('active');
        }

        function saveWidgetConfig() {
            const type = document.getElementById('cfg-type').value;
            const title = document.getElementById('cfg-title').value || 'Custom Field';
            const field = document.getElementById('cfg-field').value;
            const unit = document.getElementById('cfg-unit').value;
            const color = document.getElementById('cfg-color').value;
            const minVal = parseFloat(document.getElementById('cfg-min').value) || 0;
            const maxVal = parseFloat(document.getElementById('cfg-max').value) || 100;

            if (editingWidgetId) {
                const w = widgets.find(x => x.Id === editingWidgetId);
                if (w) {
                    w.WidgetType = type;
                    w.Title = title;
                    w.Field = field;
                    w.Unit = unit;
                    w.ColorTheme = color;
                    w.MinLimit = minVal;
                    w.MaxLimit = maxVal;
                }
            } else {
                const newId = 'w-' + Math.random().toString(36).substring(2, 9);
                widgets.push({
                    Id: newId,
                    WidgetType: type,
                    Title: title,
                    Field: field,
                    Unit: unit,
                    ColorTheme: color,
                    MinLimit: minVal,
                    MaxLimit: maxVal
                });
            }

            closeWidgetModal();
            saveLayout();
            renderDashboard();
        }

        function deleteWidget(id) {
            widgets = widgets.filter(w => w.Id !== id);
            saveLayout();
            renderDashboard();
        }

        function saveLayout() {
            localStorage.setItem('telemetry_custom_dashboard_layout', JSON.stringify(widgets));
        }

        function resetLayout() {
            localStorage.removeItem('telemetry_custom_dashboard_layout');
            location.reload();
        }

        function exportStandaloneHtml() {
            const jsonStr = JSON.stringify(widgets, null, 2);
            const htmlContent = `<!DOCTYPE html>

        function drawSparkline(canvasId, data, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.parentElement.clientWidth;
            const h = canvas.height = 120;

            ctx.clearRect(0, 0, w, h);
            if (data.length < 2) return;

            let min = Math.min(...data);
            let max = Math.max(...data);
            if (min === max) { min -= 1; max += 1; }

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();

            const step = w / (data.length - 1);
            data.forEach((val, i) => {
                const x = i * step;
                const y = h - ((val - min) / (max - min)) * (h - 20) - 10;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }
