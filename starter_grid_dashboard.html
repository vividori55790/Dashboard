<!--
    Starter: a grid that grows as channels report.

    Nothing is declared. Every tile on screen exists because a frame arrived carrying that
    channel, which is the only channel list that is true on an installation you have not seen.

    It used to read data.temp, data.humidity, data.vibration and data.rpm, and to key tiles on
    data.device. The hub sends none of those: a frame carries nodeId, variable, value and unit.
-->
<meta charset="utf-8">
<title>Telemetry starter — discovered grid</title>
<style>
    body { background:#0B0F17; color:#E8EDF7; font-family:"Segoe UI","Malgun Gothic",sans-serif;
           margin:0; padding:26px; }
    h1 { font-size:16px; margin:0 0 4px; font-weight:600; }
    .sub { color:#5F6D87; font-size:13px; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:13px; }
    .tile { background:#131A26; border:1px solid #26324A; border-radius:11px; padding:15px; }
    .tile.alarm { border-color:#FF4D5E; }
    .tile.quiet { opacity:.5; }
    .n { font-size:12px; color:#97A3BA; font-weight:600; word-break:break-all; }
    .nd { font-size:10.5px; color:#5F6D87; font-family:"JetBrains Mono",Consolas,monospace; }
    .v { font-size:26px; font-weight:600; margin:9px 0 5px; letter-spacing:-.02em; }
    .v .u { font-size:13px; color:#5F6D87; margin-left:5px; font-weight:500; }
    .z { font-size:11.5px; color:#5F6D87; }
    .alarm-text { color:#FF4D5E; }
    #none { color:#5F6D87; padding:30px 0; }
</style>

<h1>Telemetry starter — discovered grid</h1>
<div class="sub" id="sub">연결 중…</div>
<div class="grid" id="grid"></div>
<div id="none">아직 도착한 채널이 없습니다.</div>

<script src="telemetry-client.js"></script>
<script>
    var tiles = {};

    TelemetryClient.onStatusChange(function (s) {
        document.getElementById('sub').textContent =
            '연결 상태: ' + s + ' · 채널 ' + Object.keys(tiles).length + '개';
    });

    TelemetryClient.onData(function (p) {
        if (!p || typeof p.variable !== 'string' || typeof p.value !== 'number') return;

        var key = (p.nodeId || '?') + '|' + p.variable;
        var t = tiles[key];

        if (!t) {
            var el = document.createElement('div');
            el.className = 'tile';
            el.innerHTML = '<div class="n"></div><div class="nd"></div>' +
                           '<div class="v"></div><div class="z"></div>';
            el.querySelector('.n').textContent = p.variable;
            el.querySelector('.nd').textContent = p.nodeId || '';
            document.getElementById('grid').appendChild(el);
            document.getElementById('none').style.display = 'none';
            t = tiles[key] = { el: el, at: 0 };
        }

        t.at = Date.now();
        t.el.classList.remove('quiet');
        t.el.classList.toggle('alarm', p.isAnomaly === true);

        t.el.querySelector('.v').innerHTML =
            p.value.toFixed(3) + '<span class="u">' + (p.unit || '') + '</span>';

        var z = t.el.querySelector('.z');
        // The engine reports no score until it has a baseline. Absent is not zero.
        z.textContent = (typeof p.anomalyScore === 'number')
            ? ('z = ' + p.anomalyScore.toFixed(2) + 'σ')
            : '기준선 학습 중';
        z.className = 'z' + (p.isAnomaly ? ' alarm-text' : '');
    });

    // A tile whose channel has gone quiet keeps its last value but dims and says how old it is,
    // so a frozen reading is never mistaken for a live one.
    setInterval(function () {
        var now = Date.now();
        Object.keys(tiles).forEach(function (k) {
            var t = tiles[k];
            if (now - t.at <= 10000) return;
            t.el.classList.add('quiet');
            t.el.querySelector('.z').textContent =
                Math.round((now - t.at) / 1000) + '초간 수신 없음';
        });
    }, 1000);

    TelemetryClient.connect('ws://' + location.hostname + ':' + (location.port || '8080') + '/ws');
</script>
